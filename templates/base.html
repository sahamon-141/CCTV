<!DOCTYPE html>
<html lang="en" data-bs-theme="{{ theme }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} - Surveillance System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <div class="container">
        <header class="d-flex justify-content-between align-items-center py-3 mb-4 border-bottom">
            <h1 class="h4">
                <i class="bi bi-camera-video"></i> Surveillance System
                <small class="text-body-secondary">{% block subtitle %}{% endblock %}</small>
            </h1>
            <div class="d-flex align-items-center gap-3">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="themeToggle" {{ 'checked' if theme == 'dark' }}>
                    <label class="form-check-label" for="themeToggle">
                        <i class="bi {{ 'bi-moon-fill' if theme == 'dark' else 'bi-sun-fill' }}"></i>
                    </label>
                </div>
                {% block header_buttons %}{% endblock %}
            </div>
        </header>

        {% block content %}{% endblock %}
        
        <footer class="mt-5 pt-3 text-body-secondary text-center">
            <p>Surveillance System © {{ now.year }}</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Theme toggle functionality
        const themeToggle = document.getElementById('themeToggle');
        themeToggle.addEventListener('change', function() {
            const theme = this.checked ? 'dark' : 'light';
            fetch('/set_theme', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({theme: theme})
            }).then(() => {
                document.documentElement.setAttribute('data-bs-theme', theme);
                const icon = this.nextElementSibling.querySelector('i');
                icon.className = this.checked ? 'bi bi-moon-fill' : 'bi bi-sun-fill';
            });
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
